<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kripto-AI | Sinyal Real-time</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0d1117; color: #c9d1d9; }
       .signal-card { background: linear-gradient(145deg, #161b22, #1c2128); border: 1px solid #30363d; }
       .loader { border: 3px solid #30363d; border-top: 3px solid #2f81f7; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
       .btn-primary { background-color: #238636; }.btn-primary:hover { background-color: #2ea043; }
       .btn-danger { background-color: #da3633; }.btn-danger:hover { background-color: #f85149; }
       .buy { color: #3fb950; }.sell { color: #f85149; }.hold { color: #d29922; }
       .chat-bubble-user { background-color: #2f81f7; color: white; }
       .chat-bubble-ai { background-color: #21262d; }
    </style>
</head>
<body class="p-4 md:p-6">
    <div class="max-w-7xl mx-auto">
        <header class="text-center mb-6">
            <h1 class="text-3xl md:text-4xl font-bold text-white flex items-center justify-center gap-3"><i data-lucide="brain-circuit" class="text-blue-400"></i>Kripto-AI</h1>
            <p class="text-gray-400 mt-1">Analisis Sinyal Trading Real-time Berbasis AI</p>
        </header>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-[#161b22] p-4 rounded-lg border border-gray-700">
                    <h2 class="text-xl font-semibold mb-3 text-white">1. Pilih Koin</h2>
                    <div id="coin-selection" class="flex flex-wrap gap-2"></div>
                </div>
                <div class="bg-[#161b22] p-4 rounded-lg border border-gray-700">
                    <h2 class="text-xl font-semibold mb-3 text-white">2. Topik Pantauan</h2>
                    <textarea id="topics-input" rows="3" class="w-full bg-[#0d1117] border border-gray-600 rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="Contoh: Bitcoin ETF, regulasi SEC, inflasi AS..."></textarea>
                </div>
                <div class="bg-[#161b22] p-4 rounded-lg border border-gray-700">
                    <h2 class="text-xl font-semibold mb-3 text-white">3. Kontrol Analisis</h2>
                    <div class="space-y-3">
                        <button id="start-btn" class="w-full flex items-center justify-center gap-2 btn-primary text-white font-bold py-2 px-4 rounded-md transition"><i data-lucide="play"></i>Mulai Analisis Real-time</button>
                        <button id="stop-btn" class="w-full flex items-center justify-center gap-2 btn-danger text-white font-bold py-2 px-4 rounded-md transition hidden"><i data-lucide="stop-circle"></i>Hentikan Analisis</button>
                        <div id="status-indicator" class="text-center text-sm text-gray-400 p-2 rounded-md bg-[#0d1117]">Status: Tidak Aktif</div>
                    </div>
                </div>
            </div>
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-[#161b22] p-4 rounded-lg border border-gray-700 min-h-[400px]">
                    <h2 class="text-xl font-semibold mb-4 text-white">Sinyal & Analisis AI</h2>
                    <div id="loader" class="hidden flex-col items-center justify-center h-64"><div class="loader"></div><p class="mt-4 text-gray-400">AI sedang menganalisis berita...</p></div>
                    <div id="results-container" class="space-y-4"></div>
                    <div id="placeholder" class="flex flex-col items-center justify-center h-64 text-gray-500"><i data-lucide="scan-line" size="48"></i><p class="mt-4">Pilih koin dan mulai analisis.</p></div>
                </div>
                <div class="bg-[#161b22] p-4 rounded-lg border border-gray-700">
                    <h2 class="text-xl font-semibold mb-3 text-white">Chat dengan AI</h2>
                    <div id="chat-window" class="h-64 overflow-y-auto p-3 bg-[#0d1117] rounded-md mb-3 space-y-4"></div>
                    <div class="flex gap-2"><input type="text" id="chat-input" placeholder="Tanya tentang analisis..." class="flex-grow bg-[#0d1117] border border-gray-600 rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500"><button id="send-chat-btn" class="btn-primary text-white font-bold p-2 rounded-md"><i data-lucide="send"></i></button></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const AVAILABLE_COINS = ['BTC','ETH','SOL','XRP','DOGE','ADA','SHIB','AVAX','DOT','LINK'];
        const startBtn = document.getElementById('start-btn'), stopBtn = document.getElementById('stop-btn'), statusIndicator = document.getElementById('status-indicator'), loader = document.getElementById('loader'), resultsContainer = document.getElementById('results-container'), placeholder = document.getElementById('placeholder'), coinSelection = document.getElementById('coin-selection'), topicsInput = document.getElementById('topics-input'), chatWindow = document.getElementById('chat-window'), chatInput = document.getElementById('chat-input'), sendChatBtn = document.getElementById('send-chat-btn');
        let isAnalyzing = false, analysisInterval, selectedCoins = ['BTC','ETH','SOL'], chatHistory = [];
        function init() {
            AVAILABLE_COINS.forEach(c => {
                const b = document.createElement('button'); b.textContent = c; b.className = `px-3 py-1 text-sm rounded-full border transition ${selectedCoins.includes(c)?'bg-blue-600 border-blue-500 text-white':'bg-[#21262d] border-gray-600 hover:bg-[#30363d]'}`; b.onclick = () => toggleCoin(c,b); coinSelection.appendChild(b);
            });
            startBtn.onclick = startAnalysis; stopBtn.onclick = stopAnalysis; sendChatBtn.onclick = handleChatSubmit; chatInput.onkeydown = e => e.key==='Enter' && handleChatSubmit(); lucide.createIcons(); addMessageToChat('model','Halo! Saya AI Analyst Anda. Pilih koin dan mulai analisis untuk mendapat sinyal real-time.');
        }
        function toggleCoin(c,b) { const i=selectedCoins.indexOf(c); i>-1?selectedCoins.splice(i,1):selectedCoins.push(c); b.className = `px-3 py-1 text-sm rounded-full border transition ${selectedCoins.includes(c)?'bg-blue-600 border-blue-500 text-white':'bg-[#21262d] border-gray-600 hover:bg-[#30363d]'}`; }
        function startAnalysis() { if(!selectedCoins.length) return alert('Pilih minimal 1 koin!'); isAnalyzing=true; startBtn.classList.add('hidden'); stopBtn.classList.remove('hidden'); statusIndicator.textContent='Status: Mencari Berita...'; statusIndicator.classList.add('text-green-400'); placeholder.classList.add('hidden'); runAnalysisCycle(); analysisInterval=setInterval(runAnalysisCycle,300000); }
        function stopAnalysis() { isAnalyzing=false; clearInterval(analysisInterval); startBtn.classList.remove('hidden'); stopBtn.classList.add('hidden'); statusIndicator.textContent='Status: Tidak Aktif'; statusIndicator.classList.remove('text-green-400'); }
        async function runAnalysisCycle() { if(!isAnalyzing) return; loader.classList.remove('hidden'); resultsContainer.innerHTML=''; try { const topics=topicsInput.value||`crypto news`; const news=await fetchNews(topics); const analysis=await getAIAnalysis(news); displayResults(analysis); } catch(e) { resultsContainer.innerHTML=`<p class="text-red-400">Error: ${e.message}</p>`; } finally { loader.classList.add('hidden'); statusIndicator.textContent=`Status: Aktif. Update berikutnya 5 menit.`; } }
        async function fetchNews(t) { const r=await fetch(`https://newsdata.io/api/1/news?apikey=pub_c3c6a2a6a5d84f8e8b9a3b8c5a1e9b7d&q=${encodeURIComponent(t)}&language=en`); const d=await r.json(); if(!d.results?.length) throw new Error('Berita tidak ditemukan.'); return d.results.slice(0,5).map(a=>a.title+'. '+a.description).join('\n'); }
        async function getAIAnalysis(news) { const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({coins:selectedCoins,topics:topicsInput.value,newsContext:news})}); if(!r.ok) throw new Error('AI Error'); return r.json(); }
        function displayResults(d) { resultsContainer.innerHTML=''; const s=document.createElement('p'); s.className='text-gray-300 mb-4 italic'; s.textContent=`Ringkasan: ${d.summary}`; resultsContainer.appendChild(s); d.signals.forEach(sig=>{ const c=document.createElement('div'); c.className='signal-card p-4 rounded-lg'; const a=sig.action.toLowerCase(); c.innerHTML=`<div class="flex justify-between items-start"><div><h3 class="text-2xl font-bold text-white">${sig.symbol}</h3><p class="font-bold ${a}">${sig.action}</p></div><div class="text-right"><p class="text-sm text-gray-400">Confidence</p><p class="text-2xl font-bold text-white">${sig.confidence}%</p></div></div><div class="mt-4 grid grid-cols-2 gap-4 text-sm"><div><p class="text-gray-400">Target</p><p class="font-semibold text-white">${sig.target}</p></div><div><p class="text-gray-400">Timeframe</p><p class="font-semibold text-white">${sig.timeframe}</p></div><div><p class="text-gray-400">Sentimen</p><p class="font-semibold text-white">${sig.sentiment}</p></div><div><p class="text-gray-400">Risiko</p><p class="font-semibold text-white">${sig.risk}</p></div></div><div class="mt-4 pt-3 border-t border-gray-700"><p class="text-gray-400 text-xs">Alasan AI</p><p class="text-sm text-gray-300">${sig.reason}</p></div>`; resultsContainer.appendChild(c); }); }
        function addMessageToChat(r,t){ const w=document.createElement('div'); w.className=`flex ${r==='user'?'justify-end':'justify-start'}`; const b=document.createElement('div'); b.className=`p-3 rounded-lg max-w-xs md:max-w-md ${r==='user'?'chat-bubble-user':'chat-bubble-ai'}`; b.textContent=t; w.appendChild(b); chatWindow.appendChild(w); chatWindow.scrollTop=chatWindow.scrollHeight; }
        async function handleChatSubmit(){ const q=chatInput.value.trim(); if(!q) return; addMessageToChat('user',q); chatInput.value=''; chatHistory.push({role:'user',text:q}); const l=document.createElement('div'); l.className='flex justify-start'; l.innerHTML='<div class="p-3 rounded-lg chat-bubble-ai"><div class="loader!w-5!h-5"></div></div>'; chatWindow.appendChild(l); chatWindow.scrollTop=chatWindow.scrollHeight; try{ const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chatHistory,coins:selectedCoins})}); const d=await r.json(); const a=d.text; chatHistory.push({role:'model',text:a}); l.remove(); addMessageToChat('model',a); }catch(e){ l.remove(); addMessageToChat('model','Maaf, error: '+e.message); } }
        init();
    </script>
</body>
</html>
